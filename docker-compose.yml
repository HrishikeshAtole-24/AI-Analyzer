# Local infrastructure for the platform. Start with `npm run infra:up`.
# Sized for a laptop: single node everything, low memory limits.

services:
  redpanda:
    # Kafka-compatible broker; lighter than Kafka + ZooKeeper.
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: analyzer-redpanda
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --memory 512M
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      # 127.0.0.1, not localhost: on some machines another process holds [::1]:19092, and clients
      # following the advertised address would reach it instead of Redpanda.
      - --advertise-kafka-addr internal://redpanda:9092,external://127.0.0.1:19092
    ports:
      - "19092:19092" # Kafka API for apps running on the host
      - "9644:9644" # admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda-console:
    # Web UI for topics and messages: http://localhost:8080
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: analyzer-redpanda-console
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: analyzer-opensearch
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      # Security plugin off for local development only.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    # Postgres 16 with the pgvector extension for runbook and incident search.
    image: pgvector/pgvector:pg16
    container_name: analyzer-postgres
    environment:
      POSTGRES_USER: analyzer
      POSTGRES_PASSWORD: analyzer
      POSTGRES_DB: analyzer
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyzer -d analyzer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  redpanda-data:
  opensearch-data:
  postgres-data:
